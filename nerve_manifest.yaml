# Nerve Manifest
# OpenClaw Web UI / Cockpit Interface
# Generated: 2026-04-04
# This file serves dual purposes:
#  1. Human-readable project documentation (this YAML)
#  2. Machine-parseable Debian packaging metadata (debian: section)

# ─────────────────────────────────────────────────────────────
# Debian Package Metadata
# ─────────────────────────────────────────────────────────────
debian:
  source: nerve
  section: utils
  priority: optional
  maintainer: "Gregory Blaire <greg@blaire.net>"
  standards_version: "4.6.0"
  homepage: https://github.com/daggerhashimoto/openclaw-nerve
  rules_requires_root: false

  binary:
    package: nerve
    architecture: all
    depends:
      - nodejs (>= 18)
      - npm
    recommends: []
    suggests:
      - openclaw  # Core OpenClaw runtime
    description:
      short: "OpenClaw web UI / cockpit interface"
      long: |
        Nerve is the web-based cockpit interface for OpenClaw.
        Provides a graphical UI for interacting with OpenClaw agents.
        
        Note: This is an upstream community project, not Otto-managed.
        The manifest here tracks Otto's integration and deployment.

# ─────────────────────────────────────────────────────────────
# Project Metadata
# ─────────────────────────────────────────────────────────────
project:
  name: nerve
  type: openclaw-ui
  description: OpenClaw web interface - the cockpit UI
  status: external
  created: "2026-03-26"
  owner: OpenClaw Community
  repository: https://github.com/daggerhashimoto/openclaw-nerve

# ─────────────────────────────────────────────────────────────
# File Inventory
# ─────────────────────────────────────────────────────────────
files:
  docs:
    - path: README.md
      description: "Documentation"
      install_to: /usr/share/doc/nerve/
    - path: nerve_architecture.md
      description: "Architecture documentation"
      install_to: /usr/share/doc/nerve/

# ─────────────────────────────────────────────────────────────
# Dependencies
# ─────────────────────────────────────────────────────────────
external_deps:
  runtime:
    required:
      - nodejs (>= 18)
      - npm
    optional:
      - openclaw  # Core OpenClaw runtime
  build:
    - nodejs (>= 18)
    - npm

# ─────────────────────────────────────────────────────────────
# Installation Hooks
# ─────────────────────────────────────────────────────────────
hooks:
  postinst: |
    #!/bin/bash
    # Post-install: build the UI
    if [ -d /usr/lib/nerve ]; then
        cd /usr/lib/nerve
        npm install 2>/dev/null || true
        npm run build 2>/dev/null || true
    fi

  prerm: |
    #!/bin/bash
    # Pre-removal: stop services
    systemctl stop nerve* 2>/dev/null || true

# ─────────────────────────────────────────────────────────────
# Original Manifest Data (preserved)
# ─────────────────────────────────────────────────────────────
# This is the OpenClaw UI itself, not an Otto-managed project
# Excluded from standard Otto project workflows
