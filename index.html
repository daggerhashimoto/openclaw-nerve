<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nerve</title>
    <!-- The browser and installed-app bar color; theme-boot.js and applyTheme set it to the theme's ground -->
    <meta name="theme-color" content="#111318">
    <!-- Marks the stored theme's world and ground before the first paint (see public/theme-boot.js) -->
    <script src="/theme-boot.js"></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-180.png">
    <!-- Fonts are lazy-loaded by src/lib/fonts.ts when selected -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The wordmark face is self-hosted and on every first screen (loading, login, top bar) -->
    <link rel="preload" href="/fonts/ibm-plex-mono/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
